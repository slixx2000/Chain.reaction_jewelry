{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="max-w-2xl mx-auto bg-chain-slate-dark p-5 sm:p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-chain-gold">{{ title }}</h1>

        {% if item.image %}
            <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-32 h-32 object-cover rounded-lg mb-6">
        {% endif %}

        <form method="post" action="." enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            {% include 'core/_form.html' %}

            <div class="flex flex-col sm:flex-row gap-3">
                <button type="submit" class="flex-1 py-3 bg-chain-gold text-black font-semibold rounded-lg hover:bg-chain-gold-dark transition-colors">
                    Save Changes
                </button>
                <a href="{% url 'item:detail' pk=item.pk %}" class="text-center px-6 py-3 border border-chain-gold text-chain-gold rounded-lg hover:bg-chain-gold hover:text-black transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
