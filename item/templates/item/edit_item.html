{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block main_class %}{% endblock %}

{% block content %}
<div class="px-5 sm:px-8 py-12 sm:py-20">
  <div class="max-w-2xl mx-auto">
    <p class="caps text-antique mb-4">Listing</p>
    <h1 class="font-display text-4xl sm:text-5xl mb-8">{{ title }}</h1>

    {% if item.image %}
      <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-32 h-40 object-cover mb-8">
    {% endif %}

    <div class="rule mb-10"></div>

    <form method="post" action="." enctype="multipart/form-data" class="space-y-7">
      {% csrf_token %}
      {% include 'core/_form.html' %}

      <div class="flex flex-col sm:flex-row gap-3 pt-4">
        <button type="submit" class="flex-1 caps py-5 bg-ivory text-obsidian hover:bg-antique transition-colors">
          Save changes
        </button>
        <a href="{% url 'item:detail' pk=item.pk %}"
           class="text-center caps px-10 py-5 border border-ivory/40 text-ivory hover:bg-ivory hover:text-obsidian transition-colors">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
