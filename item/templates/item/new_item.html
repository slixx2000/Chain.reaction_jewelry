{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="max-w-2xl mx-auto bg-chain-slate-dark p-8 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold mb-6 text-chain-gold">{{ title }}</h1>

        <form method="post" action="." enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            {% include 'core/_form.html' %}

            <div class="flex gap-3">
                <button type="submit" class="flex-1 py-3 bg-chain-gold text-black font-semibold rounded-lg hover:bg-chain-gold-dark transition-colors">
                    Add Item
                </button>
                <a href="{% url 'dashboard:index' %}" class="px-6 py-3 border border-chain-gold text-chain-gold rounded-lg hover:bg-chain-gold hover:text-black transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
