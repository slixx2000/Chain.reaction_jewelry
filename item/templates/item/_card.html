{# Product card shared by the home page and the browse grid. Expects `item`. #}
<div class="flex flex-col border border-chain-gold rounded-lg bg-chain-dark overflow-hidden hover:shadow-lg hover:shadow-chain-gold/20 transition-shadow">
    <a href="{% url 'item:detail' pk=item.pk %}" class="block group">
        <div class="relative">
            {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.name }}" loading="lazy"
                     class="w-full h-56 object-cover group-hover:scale-105 transition-transform duration-300">
            {% else %}
                <div class="w-full h-56 bg-chain-slate flex items-center justify-center text-gray-400">No image</div>
            {% endif %}
            {% if item.is_sold %}
                <span class="absolute top-2 left-2 px-2 py-1 rounded bg-chain-wine text-white text-xs font-bold uppercase tracking-wide">Sold</span>
            {% endif %}
        </div>
        <div class="p-4">
            <h3 class="text-lg font-semibold text-chain-gold truncate">{{ item.name }}</h3>
            <p class="text-gray-300 font-bold mt-1">ZMW {{ item.price|floatformat:2 }}</p>
        </div>
    </a>
    <div class="px-4 pb-4 mt-auto">
        {% if item.is_sold %}
            <span class="block w-full text-center px-3 py-2 text-sm rounded-lg border border-gray-600 text-gray-500">Sold Out</span>
        {% else %}
            <form method="post" action="{% url 'cart:add_to_cart' item.id %}" class="js-add-to-cart-form"
                  data-item-name="{{ item.name }}" data-item-price="{{ item.price|floatformat:2 }}"
                  data-item-image="{% if item.image %}{{ item.image.url }}{% endif %}">
                {% csrf_token %}
                <button type="submit" class="w-full px-3 py-2 text-sm border border-chain-gold text-chain-gold font-semibold rounded-lg hover:bg-chain-gold hover:text-black transition-colors">
                    Add to Bag
                </button>
            </form>
        {% endif %}
    </div>
</div>
