{% extends 'core/base.html' %}

{% block title %}Password changed.{% endblock %}
{% block main_class %}{% endblock %}

{% block content %}
<div class="px-5 sm:px-8 py-16 sm:py-24">
  <div class="max-w-md mx-auto">
    <p class="caps text-antique mb-4">Account</p>
    <h1 class="font-display text-4xl sm:text-5xl mb-8">Password changed.</h1>
    <div class="rule mb-10"></div>
    <p class="text-ivory-dim mb-8">You can log in with your new password now.</p>
    <a href="{% url 'core:login' %}" class="inline-block caps px-12 py-4 bg-ivory text-obsidian hover:bg-antique transition-colors">
      Log in
    </a>
  </div>
</div>
{% endblock %}
