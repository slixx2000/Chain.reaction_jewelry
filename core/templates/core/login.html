{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="max-w-md mx-auto bg-chain-slate-dark p-5 sm:p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-chain-gold">Login to Your Account</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% include 'core/_form.html' %}
            <button type="submit" class="w-full py-3 bg-chain-gold text-black font-semibold rounded-lg hover:bg-chain-gold-dark transition-colors">
                Login
            </button>
        </form>
        <p class="mt-4 text-sm text-gray-300 text-center">
            No account yet? <a href="{% url 'core:signup' %}" class="text-chain-gold font-semibold hover:underline">Create one</a>
        </p>
    </div>
{% endblock %}
