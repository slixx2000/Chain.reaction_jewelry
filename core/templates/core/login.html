{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}
{% block main_class %}{% endblock %}

{% block content %}
<div class="px-5 sm:px-8 py-16 sm:py-24">
  <div class="max-w-md mx-auto">
    <p class="caps text-antique mb-4">Account</p>
    <h1 class="font-display text-4xl sm:text-5xl mb-8">Welcome back.</h1>
    <div class="rule mb-10"></div>

    <form method="post" class="space-y-7">
      {% csrf_token %}
      {% include 'core/_form.html' %}
      <button type="submit" class="w-full caps py-5 bg-ivory text-obsidian hover:bg-antique transition-colors">
        Log in
      </button>
    </form>

    <p class="mt-8 text-sm text-ivory-dim">
      No account yet?
      <a href="{% url 'core:signup' %}" class="caps text-antique hover:underline underline-offset-4">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
