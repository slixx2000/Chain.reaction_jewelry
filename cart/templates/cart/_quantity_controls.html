{% comment %}
Quantity stepper + remove. Rendered twice per row (mobile stacked, desktop
inline) — the hidden copy is display:none so it stays out of the a11y tree.
Expects `cart_item`.
{% endcomment %}
<div class="flex items-center border border-ivory/25">
    <form method="post" action="{% url 'cart:update_cart_item' cart_item.item.id %}">
        {% csrf_token %}
        <input type="hidden" name="quantity" value="{{ cart_item.quantity|add:'-1' }}">
        <button type="submit" class="w-9 h-9 text-ivory/70 hover:bg-ivory hover:text-obsidian transition-colors" aria-label="Decrease quantity">
            &minus;
        </button>
    </form>

    <span class="w-9 text-center caps text-ivory">{{ cart_item.quantity }}</span>

    <form method="post" action="{% url 'cart:update_cart_item' cart_item.item.id %}">
        {% csrf_token %}
        <input type="hidden" name="quantity" value="{{ cart_item.quantity|add:'1' }}">
        <button type="submit" class="w-9 h-9 text-ivory/70 hover:bg-ivory hover:text-obsidian transition-colors" aria-label="Increase quantity">
            +
        </button>
    </form>
</div>

<form method="post" action="{% url 'cart:remove_from_cart' cart_item.item.id %}" class="ml-auto sm:ml-0">
    {% csrf_token %}
    <button type="submit" class="caps text-[10px] text-ivory/40 hover:text-burgundy transition-colors underline underline-offset-4"
            aria-label="Remove {{ cart_item.item.name }}">
        Remove
    </button>
</form>
